{% include base_path %}
<a class="screen-reader-shortcut" href="#main">Skip to content</a>
<div class="masthead">
  <div class="masthead__inner-wrap">
    <a class="masthead__title" href="{{ base_path }}/">{{ site.title }}</a>
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main">
        <button type="button" aria-label="Menu"><span class="navicon"></span></button>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}"{% if page.url contains link.url and link.url != '/' %} aria-current="page"{% endif %}>{{ link.title }}</a>
            </li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" href="javascript:void(0)" aria-label="Toggle light/dark theme"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
